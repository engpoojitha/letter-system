// ── FIREBASE SYNC ─────────────────────────────────────────────────────────────
function isFirebaseConfigured(){ return false; }

async function fbSaveState(state){
  if(!isFirebaseConfigured())return null;
  try{
    const {doc,setDoc}=window.__firebaseOps;
    const db=window.__firebaseDB;
    await setDoc(doc(db,'lms','main'),{...state,_updated:new Date().toISOString()});
    return {ok:true};
  }catch(e){console.warn('Firebase save error:',e);return null;}
}

async function fbLoadState(){
  if(!isFirebaseConfigured())return null;
  try{
    const {doc,getDoc}=window.__firebaseOps;
    const db=window.__firebaseDB;
    const snap=await getDoc(doc(db,'lms','main'));
    if(snap.exists()){const d=snap.data();delete d._updated;return{ok:true,data:d};}
    return{ok:true,data:null};
  }catch(e){console.warn('Firebase load error:',e);return null;}
}

async function fbSaveUsers(users){
  if(!isFirebaseConfigured())return null;
  try{
    const {doc,setDoc}=window.__firebaseOps;
    const db=window.__firebaseDB;
    await setDoc(doc(db,'lms','users'),{list:users,_updated:new Date().toISOString()});
    return{ok:true};
  }catch(e){console.warn('Firebase users save error:',e);return null;}
}

async function fbLoadUsers(){
  if(!isFirebaseConfigured())return null;
  try{
    const {doc,getDoc}=window.__firebaseOps;
    const db=window.__firebaseDB;
    const snap=await getDoc(doc(db,'lms','users'));
    if(snap.exists()&&snap.data().list)return{ok:true,data:snap.data().list};
    return{ok:true,data:null};
  }catch(e){console.warn('Firebase users load error:',e);return null;}
}

function fbSubscribeState(callback){
  if(!isFirebaseConfigured())return ()=>{};
  try{
    const {doc,onSnapshot}=window.__firebaseOps;
    const db=window.__firebaseDB;
    return onSnapshot(doc(db,'lms','main'),(snap)=>{
      if(snap.exists()){const d=snap.data();delete d._updated;callback(d);}
    });
  }catch(e){console.warn('Firebase subscribe error:',e);return ()=>{};}
}

// Legacy GAS stub (kept for settings page)
async function gasCall(gasUrl,action,payload,timeoutMs=12000){
  if(!gasUrl)return null;
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{
    const res=await fetch(gasUrl,{
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({action,...payload}),
      cache:'no-store',
      redirect:'follow',
      signal:controller.signal
    });
    if(!res.ok)throw new Error('HTTP '+res.status);
    return await res.json();
  }catch(err){
    console.warn('Cloud request failed:',action,err?.message||err);
    return null;
  }finally{clearTimeout(timer);}
}

function FView({fd:fdata,fn,ft,fu,files}){
  const [active,setActive]=useState(null);
  const items=(Array.isArray(files)&&files.length?files:[(fu||fdata)?{name:fn||'ගොනුව',type:ft||'',url:fu,data:fdata}:null]).filter(Boolean);

function readFileData_(blob,name,type,originalSize){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=ev=>resolve({data:ev.target.result.split(',')[1],name,type:type||'application/octet-stream',size:blob.size,originalSize:originalSize||blob.size});
    reader.onerror=reject;reader.readAsDataURL(blob);
  });
}
function prepareUploadFile_(file){
  if(!String(file.type||'').startsWith('image/'))return readFileData_(file,file.name,file.type,file.size);
  return new Promise(resolve=>{
    const img=new Image();const objectUrl=URL.createObjectURL(file);
    img.onload=()=>{
      try{
        const maxDimension=1600;
        const scale=Math.min(1,maxDimension/Math.max(img.width,img.height));
        const canvas=document.createElement('canvas');
        canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
        canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
        canvas.toBlob(async blob=>{
          URL.revokeObjectURL(objectUrl);
          if(!blob){resolve(await readFileData_(file,file.name,file.type,file.size));return;}
          const base=file.name.replace(/\.[^.]+$/,'')||'photo';
          resolve(await readFileData_(blob,base+'.jpg','image/jpeg',file.size));
        },'image/jpeg',0.78);
      }catch(e){URL.revokeObjectURL(objectUrl);readFileData_(file,file.name,file.type,file.size).then(resolve);}
    };
    img.onerror=()=>{URL.revokeObjectURL(objectUrl);readFileData_(file,file.name,file.type,file.size).then(resolve);};
    img.src=objectUrl;
  });
}
function useFiles(){
  const [files,setFiles]=useState([]);
  const handle=e=>{
    const selected=Array.from(e.target.files||[]);
    if(!selected.length)return;
    if(files.length+selected.length>20){alert('එක letter එකකට photos/files 20ක් දක්වා එකතු කළ හැකියි.');e.target.value='';return;}
    const tooLarge=selected.find(f=>String(f.type||'').startsWith('image/')?f.size>25*1024*1024:f.size>10*1024*1024);
    if(tooLarge){alert(tooLarge.name+' file එක upload limit එකට වඩා විශාලයි.');e.target.value='';return;}
    Promise.all(selected.map(prepareUploadFile_)).then(newFiles=>setFiles(previous=>[...previous,...newFiles])).catch(()=>alert('Files process කළ නොහැකි විය.'));
    e.target.value='';
  };
  return [files,setFiles,handle];
}

  const go=async()=>{

// ── IN LETTER MODAL ───────────────────────────────────────────────────────────
function InModal({letter,user,onClose,onUpdate,allUsers}){
  const [note,setNote]=useState(letter.note||'');
  const [editN,setEditN]=useState(false);
  const [showA,setShowA]=useState(false);
  const [newA,setNewA]=useState(letter.asgn.map(a=>a.u));
  const isDE=user.r==='DE',isCC=user.r==='CC';
  const assignable=allUsers.filter(u=>u.active&&u.u!=='DE');

  useEffect(()=>{
    const my=letter.asgn.find(a=>a.u===user.u);
    if(my&&!my.seen){
      const upd=letter.asgn.map(a=>a.u===user.u?{...a,seen:new Date().toISOString()}:a);
      onUpdate(letter.id,{asgn:upd});
    }
  },[]);

  const updStatus=s=>{
    const upd=letter.asgn.map(a=>a.u===user.u?{...a,s}:a);
    const allD=upd.every(a=>a.s==='done'),anyO=upd.some(a=>a.s==='ongoing');
    let ns=letter.status;
    if(letter.status!=='pending_de'){ns=allD?'done':anyO?'ongoing':'de_reviewed';}
    onUpdate(letter.id,{asgn:upd,status:ns});
  };
  const saveNote=()=>{onUpdate(letter.id,{note});setEditN(false);};
  const approve=()=>onUpdate(letter.id,{status:'de_reviewed',note,deAt:new Date().toISOString()});
  const saveA=()=>{
    const asgn=newA.map(u=>({u,d:allUsers.find(x=>x.u===u).d,s:letter.asgn.find(a=>a.u===u)?.s||'pending',seen:letter.asgn.find(a=>a.u===u)?.seen||null}));
    onUpdate(letter.id,{asgn});setShowA(false);
  };
  const my=letter.asgn.find(a=>a.u===user.u);
  const canEdit=my&&letter.status!=='pending_de';

  return <Mod title={`📄 ${letter.ref}`} onClose={onClose}>
    <div className="g2">
      <Fld l="Reference No" v={letter.ref}/><Fld l="Date Received" v={fd(letter.dr)}/>
      <Fld l="From" v={letter.from}/><Fld l="To" v={letter.to}/>
      <Fld l="Uploaded By" v={letter.by}/><Fld l="Date Uploaded" v={fdt(letter.du)}/>
      <Fld l="Status" v={<Bdg s={letter.status}/>}/>{letter.deAt&&<Fld l="DE Reviewed" v={fdt(letter.deAt)}/>}
    </div>
    <Fld l="Subject" v={letter.subj}/>
    {letter.desc&&<Fld l="Description" v={letter.desc}/>}
    <FView fd={letter.fd} fn={letter.fn} ft={letter.ft} fu={letter.fu} files={letter.files}/>

    {(isDE||letter.note)&&<div className="na">
      <div style={{fontWeight:700,color:'#003580',marginBottom:7,fontSize:13}}>📝 DE Note / Instructions</div>
      {isDE&&editN
        ?<><textarea className="fi" style={{height:75}} value={note} onChange={e=>setNote(e.target.value)} placeholder="Instructions…"/>
          <div className="fr" style={{marginTop:7}}>
            <button className="btn bp bsm" onClick={saveNote}>Save</button>
            <button className="btn bs bsm" onClick={()=>{setNote(letter.note||'');setEditN(false);}}>Cancel</button>
          </div></>
        :<><div style={{fontSize:13,color:'#333',whiteSpace:'pre-wrap',minHeight:22}}>{letter.note||<span style={{color:'#bbb'}}>No note.</span>}</div>
          {isDE&&<button className="btn bp bsm" style={{marginTop:7}} onClick={()=>setEditN(true)}>✏️ Edit Note</button>}</>}
    </div>}

    {letter.asgn.length>0&&<div style={{marginTop:14}}>
      <div style={{fontWeight:700,color:'#003580',marginBottom:7,fontSize:13}}>👥 Assigned Members</div>
      {letter.asgn.map(a=><div key={a.u} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'7px 11px',background:'#f9f9f9',border:'1px solid #eee',borderRadius:6,marginBottom:5}}>
        <div>
          <span style={{fontSize:13,fontWeight:600}}>{a.d}</span>
          {isDE&&<span style={{marginLeft:9,fontSize:11,fontWeight:600,color:a.seen?'#27ae60':'#e74c3c'}}>
            {a.seen?`👁 Seen ${fdt(a.seen)}`:'👁 Not Seen'}
          </span>}
        </div>
        <div className="fr">
          <Bdg s={a.s}/>
          {a.u===user.u&&canEdit&&<select value={a.s} onChange={e=>updStatus(e.target.value)} style={{fontSize:12,padding:'3px 7px',borderRadius:4,border:'1px solid #ccc'}}>
            <option value="pending">Pending</option>
            <option value="attended">Attended</option>
            <option value="ongoing">Ongoing</option>
            <option value="done">Done</option>
          </select>}
        </div>
      </div>)}
    </div>}

    {isDE&&<div style={{marginTop:14,display:'flex',gap:8,flexWrap:'wrap'}}>
      <button className="btn bp bsm" onClick={()=>setShowA(true)}>👤 Manage Assignees</button>
      {letter.status==='pending_de'&&<button className="btn bg" onClick={approve}>✅ Approve & DE Reviewed</button>}
    </div>}
    {isDE&&letter.status==='pending_de'&&<div className="ab aw" style={{marginTop:12}}><strong>⚡ Action Required:</strong> Review, add note, then Approve.</div>}

    {showA&&<Mod title="Manage Assignees" onClose={()=>setShowA(false)}>
      <div style={{display:'flex',flexWrap:'wrap'}}>
        {assignable.map(a=><label key={a.u} className={`at${newA.includes(a.u)?' sel':''}`}>
          <input type="checkbox" checked={newA.includes(a.u)} onChange={()=>setNewA(p=>p.includes(a.u)?p.filter(x=>x!==a.u):[...p,a.u])} style={{margin:0}}/> {a.d}
        </label>)}
      </div>
      <div className="fr" style={{justifyContent:'flex-end',marginTop:13}}>
        <button className="btn bs" onClick={()=>setShowA(false)}>Cancel</button>
        <button className="btn bp" onClick={saveA}>Save</button>
      </div>
    </Mod>}
  </Mod>;
}

    <div className="g2">

      <Fld l="From" v={letter.from}/><Fld l="To" v={letter.to}/>

// ── DASHBOARD ─────────────────────────────────────────────────────────────────
function Dashboard({user,state,setPage,setFS}){
  const {inL}=state;
  const isDE=user.r==='DE',isCC=user.r==='CC',isAdmin=isDE||isCC;
  const tot=inL.length,pde=inL.filter(l=>l.status==='pending_de').length;
  const don=inL.filter(l=>l.status==='done').length,ong=inL.filter(l=>l.status==='ongoing').length;
  const my=inL.filter(l=>l.asgn.some(a=>a.u===user.u));
  const myP=my.filter(l=>l.asgn.find(a=>a.u===user.u)?.s==='pending');
  const myO=my.filter(l=>l.asgn.find(a=>a.u===user.u)?.s==='ongoing');
  const myD=my.filter(l=>l.asgn.find(a=>a.u===user.u)?.s==='done');
  const unseen=isDE?inL.reduce((s,l)=>s+l.asgn.filter(a=>!a.seen).length,0):0;
  const go=s=>{setFS(s);setPage('in');};
  return <div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(140px,1fr))',gap:13,marginBottom:22}}>
      {isAdmin&&<>
        <SCard label="Total In Letters" value={tot} color="#003580" onClick={()=>go('')}/>
        <SCard label="Pending DE Review" value={pde} color="#e67e22" onClick={()=>go('pending_de')}/>
        <SCard label="Ongoing" value={ong} color="#8e44ad" onClick={()=>go('ongoing')}/>
        <SCard label="Completed" value={don} color="#27ae60" onClick={()=>go('done')}/>
        <SCard label="Out Letters" value={state.outL.length} color="#16a085" onClick={()=>setPage('out')}/>
      </>}
      {(isCC||!isAdmin)&&<>

function SettingsPage({gasUrl,onSaveGAS,state,onSaveState}){
  const [url,setUrl]=useState(gasUrl);
  const [testing,setTesting]=useState(false);
  const [testResult,setTestResult]=useState('');
  const [importing,setImporting]=useState(false);

  const saveUrl=()=>{onSaveGAS(url.trim());setTestResult('');};
  const testConn=async()=>{
    if(!url.trim()){setTestResult('error:Enter URL first.');return;}
    setTesting(true);setTestResult('');
    const r=await gasCall(url.trim(),'ping',{});
    setTesting(false);
    if(r&&r.ok)setTestResult('ok:Connected! Google Sheets sync is working.');
    else setTestResult('error:Connection failed. Check the URL and try again.');
  };
  const exportData=()=>{
    const json=JSON.stringify(state,null,2);
    const blob=new Blob([json],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='DE_LMS_backup.json';a.click();
  };
  const importData=(e)=>{
    const fl=e.target.files?.[0];if(!fl)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.inL&&d.outL){onSaveState(d);alert('Data imported successfully!');}
        else alert('Invalid backup file.');
      }catch{alert('Invalid JSON file.');}
    };
    r.readAsText(fl);
  };

  return <div>
    {/* Google Sheets Sync */}
    <div style={{background:'#fff',border:'1px solid #e0e0e0',borderRadius:10,padding:20,marginBottom:20}}>
      <h3 style={{color:'#003580',marginBottom:14,fontSize:14}}>☁️ Cloud Sync (Google Apps Script)</h3>
      <div className="ab ag" style={{marginBottom:14}}>✅ <strong>Google Apps Script sync is active.</strong> Letters sync through Google Sheets and documents upload to Google Drive.</div>
      <div className="fg"><label className="flb">Google Apps Script Web App URL</label>
        <input className="fi" value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/AKfycb.../exec"/>
      </div>
      <div className="fr" style={{marginBottom:14}}>
        <button className="btn bp" onClick={saveUrl}>💾 Save URL</button>
        <button className="btn bs" onClick={testConn} disabled={testing}>{testing?'Testing…':'🔌 Test Connection'}</button>
      </div>
      {testResult&&<div className={`ab ${testResult.startsWith('ok:')?'ag':'ae'}`}>{testResult.slice(testResult.indexOf(':')+1)}</div>}
      <hr className="divider"/>
      <div style={{fontWeight:700,color:'#333',marginBottom:8,fontSize:13}}>📋 GAS Script to paste in Google Apps Script:</div>
      <pre style={{background:'#f5f5f5',padding:14,borderRadius:6,fontSize:11,overflowX:'auto',border:'1px solid #e0e0e0',lineHeight:1.6}}>{`function doPost(e) {
  var data = JSON.parse(e.postData.contents);
  var ss = SpreadsheetApp.openById('YOUR_SHEET_ID');
  
  if (data.action === 'ping') {
    return ContentService.createTextOutput(JSON.stringify({ok:true}))
      .setMimeType(ContentService.MimeType.JSON);
  }
  if (data.action === 'upload') {
    var folder = DriveApp.getFolderById('1k85Zb_yZoL9aGYQ9RZQhspQrnNjXW_Sb');
    var bytes = Utilities.base64Decode(data.fileData);
    var blob = Utilities.newBlob(bytes, data.fileType || 'application/octet-stream', data.fileName || 'attachment');
    var file = folder.createFile(blob);
    file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
    return ContentService.createTextOutput(JSON.stringify({ok:true,url:file.getUrl(),id:file.getId()}))
      .setMimeType(ContentService.MimeType.JSON);
  }
  if (data.action === 'save') {
    var sheet = ss.getSheetByName('Data') || ss.insertSheet('Data');
    sheet.clearContents();
    sheet.getRange(1,1).setValue(JSON.stringify(data.payload));
    return ContentService.createTextOutput(JSON.stringify({ok:true}))
      .setMimeType(ContentService.MimeType.JSON);
  }
  if (data.action === 'load') {
    var sheet = ss.getSheetByName('Data');
    if (!sheet || sheet.getLastRow()===0) 
      return ContentService.createTextOutput(JSON.stringify({ok:true,data:null}))
        .setMimeType(ContentService.MimeType.JSON);
    var val = sheet.getRange(1,1).getValue();
    return ContentService.createTextOutput(JSON.stringify({ok:true,data:JSON.parse(val)}))
      .setMimeType(ContentService.MimeType.JSON);
  }
}`}</pre>
      <div className="ab aw" style={{marginTop:10,fontSize:12}}>Replace <strong>YOUR_SHEET_ID</strong> with the ID from your Google Sheet URL.</div>
    </div>

    {/* Backup / Restore */}
    <div style={{background:'#fff',border:'1px solid #e0e0e0',borderRadius:10,padding:20}}>
      <h3 style={{color:'#003580',marginBottom:14,fontSize:14}}>💾 Backup & Restore</h3>
      <div className="fr">
        <button className="btn bp" onClick={exportData}>⬇ Export Backup (JSON)</button>
        <label className="btn bs" style={{cursor:'pointer'}}>
          ⬆ Import Backup
          <input type="file" accept=".json" onChange={importData} style={{display:'none'}}/>
        </label>
      </div>
      <div style={{fontSize:12,color:'#888',marginTop:10}}>Export saves all letters to a JSON file. Import restores from a backup.</div>
    </div>
  </div>;
}

function App(){
  const [user,setUser]=useState(()=>{const s=ldSess();return s?.token?s:null;});
  const [page,setPage]=useState('dash');
  const [state,setState]=useState(ldState);
  const [allUsers,setAllUsers]=useState(ldUsers);
  const [fs,setFS]=useState(undefined);
  const [gasUrl,setGasUrl]=useState(ldGAS);
  const [syncState,setSyncState]=useState('off');
  const syncingRef=useRef(false);

  const sv=async n=>{
    setState(n);svState(n);
    if(isFirebaseConfigured()){const r=await fbSaveState(n);setSyncState(r?.ok?'ok':'off');return r;}
    if(!gasUrl){setSyncState('off');return null;}
    syncingRef.current=true;setSyncState('busy');
    try{
      const r=await gasCall(gasUrl,'save',{payload:n});
      if(r?.ok){
        if(r.data){setState(r.data);svState(r.data);}
        setSyncState('ok');
        return r;
      }
      setSyncState('off');
      alert('Cloud save failed. මෙම record එක වෙනත් device වල නොපෙනේ. Internet connection එක පරීක්ෂා කර නැවත save කරන්න.');
      return r;
    }finally{syncingRef.current=false;}
  };
  const uploadToDrive=async l=>{
    const pending=Array.isArray(l.files)&&l.files.length?l.files:(l.fd?[{data:l.fd,name:l.fn,type:l.ft}]:[]);
    if(!pending.length||!gasUrl)return l;
    const uploaded=[];
    const letterDate=String(l.dr||l.ds||new Date().toISOString().slice(0,10)).slice(0,10);
    const safeRef=String(l.ref||'Letter').replace(/[^A-Za-z0-9_-]/g,'_');
    for(let i=0;i<pending.length;i++){
      const file=pending[i];
      const originalExt=(String(file.name||'').match(/\.([A-Za-z0-9]+)$/)||[])[1]||'bin';
      const ext=String(file.type||'').startsWith('image/')?'jpg':originalExt.toLowerCase();
      const standardName=`${letterDate}_${safeRef}_${String(i+1).padStart(2,'0')}.${ext}`;
      const r=await gasCall(gasUrl,'upload',{fileData:file.data,fileName:standardName,fileType:file.type},30000);
      if(r?.ok&&r.url)uploaded.push({name:r.name||standardName,type:file.type,url:r.url,id:r.id,size:file.size,originalSize:file.originalSize});
    }
    if(uploaded.length!==pending.length)alert((pending.length-uploaded.length)+' file(s) Google Drive වෙත upload කළ නොහැකි විය.');
    return {...l,files:uploaded,fn:uploaded[0]?.name,ft:uploaded[0]?.type,fu:uploaded[0]?.url,fd:undefined};
  };
  const addIn=async l=>{const n=await uploadToDrive(l);const stamped={...n,_syncUpdatedAt:Date.now()};await sv({...state,inL:[...state.inL,stamped],inC:state.inC+1});};
  const updIn=(id,p)=>sv({...state,inL:state.inL.map(l=>l.id===id?{...l,...p,_syncUpdatedAt:Date.now()}:l)});
  const addOut=async l=>{const n=await uploadToDrive(l);const stamped={...n,_syncUpdatedAt:Date.now()};await sv({...state,outL:[...state.outL,stamped],outC:state.outC+1});};
  const saveUsers=async(u,mutation)=>{
    if(!user?.token){alert('DE session expired. නැවත login කරන්න.');logout();return false;}
    const r=await gasCall(gasUrl,'adminUsers',{token:user.token,mutation});
    if(r?.ok&&r.data){setAllUsers(r.data);svUsers(r.data);return true;}
    alert(r?.error||'User change save කළ නොහැකි විය.');
    return false;
  };
  const saveGAS=url=>{setGasUrl(url);svGAS(url);};
  const saveState=s=>sv(s);

  const syncToGAS=useCallback(async(s)=>{
    // Legacy GAS sync (kept for backwards compatibility)
    const url=ldGAS();if(!url)return;
    setSyncState('busy');
    const r=await gasCall(url,'save',{payload:s});
    setSyncState(r?.ok?'ok':'off');
  },[]);

  // Load from Firebase on startup + subscribe to real-time updates
  useEffect(()=>{
    let unsubscribe=()=>{};
    let timer=null;
    (async()=>{
      if(isFirebaseConfigured()){
        setSyncState('busy');
        // Load users from Firebase first
        const ur=await fbLoadUsers();
        if(ur?.ok&&ur.data){setAllUsers(ur.data);svUsers(ur.data);}
        // Load letters state
        const r=await fbLoadState();
        if(r?.ok&&r.data){setState(r.data);svState(r.data);setSyncState('ok');}
        else setSyncState('off');
        // Subscribe for real-time updates from other devices
        unsubscribe=fbSubscribeState((data)=>{
          setState(data);svState(data);setSyncState('ok');
        });
      } else if(gasUrl){
        const directory=await gasCall(gasUrl,'directory',{});
        if(directory?.ok&&directory.data){setAllUsers(directory.data);svUsers(directory.data);}
        const pull=async()=>{
          if(syncingRef.current)return;
          const r=await gasCall(gasUrl,'load',{});
          if(r?.ok){
            if(r.data){setState(prev=>{if(JSON.stringify(prev)===JSON.stringify(r.data))return prev;svState(r.data);return r.data;});}
            setSyncState('ok');
          }else setSyncState('off');
        };
        setSyncState('busy');
        await pull();
        timer=setInterval(pull,5000);
      }
    })();
    return ()=>{unsubscribe();if(timer)clearInterval(timer);};
  },[]);

  const login=u=>{setUser(u);svSess(u);setPage('dash');};
  const logout=()=>{setUser(null);svSess(null);setPage('dash');};

  if(!user)return <LoginPage onLogin={login}/>;

  return <div style={{minHeight:'100vh',background:'#f0f2f7'}}>
    <TopNav user={user} page={page} setPage={p=>{setPage(p);setFS(undefined);}} onLogout={logout} gasUrl={gasUrl} syncState={syncState}/>
    <div style={{maxWidth:1280,margin:'0 auto',padding:'18px 14px'}}>
      <div style={{background:'#fff',borderRadius:10,boxShadow:'0 2px 12px rgba(0,0,0,.08)',padding:'20px 22px',minHeight:400}}>
        {page==='dash'&&<><h2 style={{margin:'0 0 16px',color:'#003580',fontSize:16,fontWeight:800}}>🏠 Dashboard</h2><Dashboard user={user} state={state} setPage={setPage} setFS={setFS}/></>}
        {page==='in'&&<><h2 style={{margin:'0 0 14px',color:'#003580',fontSize:16,fontWeight:800}}>📥 Incoming Letters</h2><InPage user={user} state={state} onAdd={addIn} onUpd={updIn} fs={fs} setFS={setFS} allUsers={allUsers}/></>}
        {page==='out'&&!['STO','TO'].includes(user.r)&&<><h2 style={{margin:'0 0 14px',color:'#003580',fontSize:16,fontWeight:800}}>📤 Outgoing Letters</h2><OutPage user={user} state={state} onAdd={addOut} allUsers={allUsers}/></>}
        {page==='rep'&&['DE','CC'].includes(user.r)&&<><h2 style={{margin:'0 0 14px',color:'#003580',fontSize:16,fontWeight:800}}>📊 Reports</h2><RepPage state={state} allUsers={allUsers}/></>}
        {page==='users'&&user.r==='DE'&&<><h2 style={{margin:'0 0 14px',color:'#003580',fontSize:16,fontWeight:800}}>👥 User Management</h2><UsersPage allUsers={allUsers} onSaveUsers={saveUsers}/></>}
        {page==='settings'&&user.r==='DE'&&<><h2 style={{margin:'0 0 14px',color:'#003580',fontSize:16,fontWeight:800}}>⚙️ Settings</h2><SettingsPage gasUrl={gasUrl} onSaveGAS={saveGAS} state={state} onSaveState={saveState}/></>}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
